services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: machi
      POSTGRES_PASSWORD: machi
      POSTGRES_DB: machi
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machi -d machi"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - machi_db:/var/lib/postgresql/data
volumes:
  machi_db:
